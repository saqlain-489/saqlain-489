<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Saqlain Ahmad, Full-Stack and AI Engineer</title>
  <desc id="desc">I build AI agents that run in production, and the full-stack TypeScript apps around them. Faisalabad, Pakistan.</desc>
  <style>
    .sans{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace} .b{font-weight:700}
    .flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
    .small{animation:small 4s ease-in-out infinite} .large{animation:large 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    @keyframes small{0%,40%{opacity:1}50%,90%{opacity:.28}100%{opacity:1}}
    @keyframes large{0%,40%{opacity:.28}50%,90%{opacity:1}100%{opacity:.28}}
    @media (prefers-reduced-motion:reduce){.flow,.small,.large{animation:none}}
  </style>
  <defs>
    <radialGradient id="bna" cx="0.88" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnb" cx="0.04" cy="1" r="0.65">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bng" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="bnc"><rect width="1200" height="320" rx="18"/></clipPath>
    <marker id="bnm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9198a1"/>
    </marker>
  </defs>
  <g clip-path="url(#bnc)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#bng)"/>
    <rect width="1200" height="320" fill="url(#bna)"/>
    <rect width="1200" height="320" fill="url(#bnb)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="64" y="90" class="mono b" font-size="14" letter-spacing="3" fill="#2dd4bf">FULL-STACK &amp; AI ENGINEER</text>
  <text x="61" y="158" class="sans b" font-size="64" letter-spacing="-1.5" fill="#e6edf3">Saqlain Ahmad</text>
  <text x="64" y="206" class="sans" font-size="23" fill="#9198a1">I build AI agents that run in production,</text>
  <text x="64" y="237" class="sans" font-size="23" fill="#9198a1">and the full-stack TypeScript apps around them.</text>
  <text x="64" y="280" class="mono" font-size="14" fill="#9198a1">Faisalabad, Pakistan  ·  TypeScript  ·  Node  ·  React  ·  Mastra</text>

  <text x="716" y="56" class="mono" font-size="12" letter-spacing="1" fill="#9198a1">multi-agent pipeline</text>
  <path d="M828 102H866" stroke="#9198a1" stroke-width="1.5" class="flow" marker-end="url(#bnm)"/>
  <path d="M980 102H1018" stroke="#9198a1" stroke-width="1.5" class="flow" marker-end="url(#bnm)"/>
  <path d="M1076 132C1076 184 924 184 924 136" fill="none" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5" class="flow" marker-end="url(#bnm)"/>
  <circle r="4" fill="#2dd4bf"><animateMotion dur="2.6s" repeatCount="indefinite" path="M828 102H1020"/></circle>
  <circle r="4" fill="#a78bfa"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M1076 132C1076 184 924 184 924 136"/></circle>
  
  <rect x="716" y="72" width="112" height="60" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="772" y="99" text-anchor="middle" class="mono b" font-size="16" fill="#e6edf3">plan</text>
  <text x="772" y="119" text-anchor="middle" class="mono" font-size="12" fill="#9198a1">outline</text>
  
  <rect x="868" y="72" width="112" height="60" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="924" y="99" text-anchor="middle" class="mono b" font-size="16" fill="#e6edf3">write</text>
  <text x="924" y="119" text-anchor="middle" class="mono" font-size="12" fill="#9198a1">sections</text>
  
  <rect x="1020" y="72" width="112" height="60" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1076" y="99" text-anchor="middle" class="mono b" font-size="16" fill="#e6edf3">review</text>
  <text x="1076" y="119" text-anchor="middle" class="mono" font-size="12" fill="#9198a1">evals</text>
  <text x="1000" y="196" text-anchor="middle" class="mono" font-size="12" fill="#9198a1">revise until it passes</text>

  <rect x="716" y="220" width="416" height="52" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="734" y="251" class="mono b" font-size="13" fill="#a78bfa">model router</text>
  
  <g class="small"><rect x="858" y="232" width="74" height="28" rx="14" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="895" y="251" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">small</text></g>
  
  <g class="large"><rect x="940" y="232" width="74" height="28" rx="14" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="977" y="251" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">large</text></g>
  <text x="1116" y="251" text-anchor="end" class="mono b" font-size="14" fill="#fbbf24">≈ −85% cost</text>
</svg>
