    </pattern>
    <clipPath id="crecitec"><rect width="640" height="300" rx="18"/></clipPath>
    <marker id="crecitem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9198a1"/>
    </marker>
  </defs>
