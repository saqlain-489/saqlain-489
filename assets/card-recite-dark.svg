  <text x="30" y="98" class="sans b" font-size="38" letter-spacing="-0.8" fill="#e6edf3">recite</text>
  <text x="32" y="138" class="sans" font-size="21" fill="#9198a1">Recite into the mic and watch every word,</text>
  <text x="32" y="165" class="sans" font-size="21" fill="#9198a1">and every letter, light up as you go.</text>
