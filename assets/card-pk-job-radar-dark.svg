<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">pk-job-radar</title>
  <desc id="d">Finds and ranks engineering jobs straight from Pakistani companies’ own careers pages. 7,435 map results narrowed to 577 companies. A model reads only the pages that changed. Built with Node.js, SQLite, Puppeteer, Express.</desc>
  <style>
    .sans{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace} .b{font-weight:700}
    .flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
    .small{animation:small 4s ease-in-out infinite} .large{animation:large 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    @keyframes small{0%,40%{opacity:1}50%,90%{opacity:.28}100%{opacity:1}}
    @keyframes large{0%,40%{opacity:.28}50%,90%{opacity:1}100%{opacity:.28}}
    @media (prefers-reduced-motion:reduce){.flow,.small,.large{animation:none}}
  </style>
  <defs>
    <radialGradient id="cpkjobradara" cx="0.88" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cpkjobradarb" cx="0.04" cy="1" r="0.65">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cpkjobradarg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="cpkjobradarc"><rect width="640" height="300" rx="18"/></clipPath>
    <marker id="cpkjobradarm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9198a1"/>
    </marker>
  </defs>
  <g clip-path="url(#cpkjobradarc)">
    <rect width="640" height="300" fill="#0d1117"/>
    <rect width="640" height="300" fill="url(#cpkjobradarg)"/>
    <rect width="640" height="300" fill="url(#cpkjobradara)"/>
    <rect width="640" height="300" fill="url(#cpkjobradarb)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="298.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="32" y="50" class="mono b" font-size="15" letter-spacing="2" fill="#2dd4bf">DATA PIPELINE · AUTOMATION</text>
  <text x="30" y="98" class="sans b" font-size="38" letter-spacing="-0.8" fill="#e6edf3">pk-job-radar</text>
  <text x="32" y="138" class="sans" font-size="21" fill="#9198a1">Finds and ranks engineering jobs straight</text>
  <text x="32" y="165" class="sans" font-size="21" fill="#9198a1">from Pakistani companies’ own careers pages.</text>
  <circle cx="38" cy="203" r="4" fill="#fbbf24"/><text x="52" y="210" class="sans" font-size="19" fill="#e6edf3">7,435 map results narrowed to 577 companies</text>
  <circle cx="38" cy="231" r="4" fill="#fbbf24"/><text x="52" y="238" class="sans" font-size="19" fill="#e6edf3">A model reads only the pages that changed</text>
  <rect x="32" y="250" width="86" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="75" y="270" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">Node.js</text><rect x="126" y="250" width="78" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="165" y="270" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">SQLite</text><rect x="212" y="250" width="103" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="263.5" y="270" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">Puppeteer</text><rect x="323" y="250" width="86" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text x="366" y="270" text-anchor="middle" class="mono" font-size="14" fill="#e6edf3">Express</text>
  <circle cx="552" cy="70" r="34" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="552" cy="70" r="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
