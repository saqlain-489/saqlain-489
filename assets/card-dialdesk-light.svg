<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">dialdesk</title>
  <desc id="d">Browser softphone and call CRM with live transcripts and an AI voice receptionist. Whisper transcribes calls inside the browser. Tenant isolation and toll-fraud guards. Built with React, Express, MongoDB, Twilio.</desc>
  <style>
    .sans{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace} .b{font-weight:700}
    .flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
    .small{animation:small 4s ease-in-out infinite} .large{animation:large 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    @keyframes small{0%,40%{opacity:1}50%,90%{opacity:.28}100%{opacity:1}}
    @keyframes large{0%,40%{opacity:.28}50%,90%{opacity:1}100%{opacity:.28}}
    @media (prefers-reduced-motion:reduce){.flow,.small,.large{animation:none}}
  </style>
