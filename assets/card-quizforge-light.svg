      <stop offset="0" stop-color="#0f766e" stop-opacity="0.1"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cquizforgeb" cx="0.04" cy="1" r="0.65">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.1"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cquizforgeg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2328" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="cquizforgec"><rect width="640" height="300" rx="18"/></clipPath>
    <marker id="cquizforgem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <g clip-path="url(#cquizforgec)">
    <rect width="640" height="300" fill="#ffffff"/>
    <rect width="640" height="300" fill="url(#cquizforgeg)"/>
    <rect width="640" height="300" fill="url(#cquizforgea)"/>
    <rect width="640" height="300" fill="url(#cquizforgeb)"/>
  </g>
  <rect x="0.75" y="0.75" width="638.5" height="298.5" rx="17.5" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="32" y="50" class="mono b" font-size="15" letter-spacing="2" fill="#0f766e">AI AGENTS · LLM EVALS</text>
  <text x="30" y="98" class="sans b" font-size="38" letter-spacing="-0.8" fill="#1f2328">quizforge</text>
  <text x="32" y="138" class="sans" font-size="21" fill="#59636e">Turns any document into a quiz where every</text>
  <text x="32" y="165" class="sans" font-size="21" fill="#59636e">answer is checked against the source and cited.</text>
  <circle cx="38" cy="203" r="4" fill="#b45309"/><text x="52" y="210" class="sans" font-size="19" fill="#1f2328">Planner, writers, 17 checks, a two-tier judge</text>
  <circle cx="38" cy="231" r="4" fill="#b45309"/><text x="52" y="238" class="sans" font-size="19" fill="#1f2328">A 31-case benchmark gates every CI run</text>
  <rect x="32" y="250" width="112" height="30" rx="15" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="88" y="270" text-anchor="middle" class="mono" font-size="14" fill="#1f2328">TypeScript</text><rect x="152" y="250" width="78" height="30" rx="15" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="191" y="270" text-anchor="middle" class="mono" font-size="14" fill="#1f2328">Mastra</text><rect x="238" y="250" width="112" height="30" rx="15" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="294" y="270" text-anchor="middle" class="mono" font-size="14" fill="#1f2328">Claude API</text><rect x="358" y="250" width="86" height="30" rx="15" fill="#f6f8fa" stroke="#d1d9e0"/>
